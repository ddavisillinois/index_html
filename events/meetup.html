<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meetup</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }
        .form-container .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-container button {
            grid-column: span 3;
            padding: 10px;
            font-size: 16px;
        }
        @media (max-width: 768px) {
            .form-container {
                grid-template-columns: 1fr 1fr;
            }
            .form-container button {
                grid-column: span 2;
            }
        }
        @media (max-width: 576px) {
            .form-container {
                grid-template-columns: 1fr;
            }
            .form-container button {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Meetup</h1>
        <p>Details about the networking event for developers.</p>
        <a href="../index.html" class="btn btn-secondary mb-3">Back to Home</a>
        <a href="../eventhome.html" class="btn btn-secondary mb-3">Back to Events Home</a>
        <form class="form-container">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number">
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" class="form-control" id="address" placeholder="Enter your address">
            </div>
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" class="form-control" id="city" placeholder="Enter your city">
            </div>
            <div class="form-group">
                <label for="state">State</label>
                <input type="text" class="form-control" id="state" placeholder="Enter your state">
            </div>
            <div class="form-group">
                <label for="zipcode">Zipcode</label>
                <input type="text" class="form-control" id="zipcode" placeholder="Enter your zipcode">
            </div>
            <div class="form-group">
                <label for="start-date">Start Date</label>
                <input type="date" class="form-control" id="start-date">
            </div>
            <div class="form-group">
                <label for="start-time">Start Time</label>
                <input type="time" class="form-control" id="start-time">
            </div>
            <div class="form-group">
                <label for="end-date">End Date</label>
                <input type="date" class="form-control" id="end-date">
            </div>
            <div class="form-group">
                <label for="end-time">End Time</label>
                <input type="time" class="form-control" id="end-time">
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</body>
</html>
